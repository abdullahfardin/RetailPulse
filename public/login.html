<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetailPulse - Sign In & Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-2">RP</div>
        <h3 class="fw-bold mb-1">RetailPulse</h3>
        <p class="text-muted small">Retail Sales, Demand Forecasting & Inventory Planning</p>
      </div>

      <!-- Quick Demo Access Banner -->
      <div class="alert alert-info py-2 px-3 mb-3 d-flex align-items-center justify-content-between">
        <div>
          <small class="d-block fw-semibold text-primary"><i class="bi bi-shield-check me-1"></i> Live Assessment Demo</small>
          <small class="text-muted">owner@retailpulse.com</small>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary" id="btnFillDemo">
          Quick Fill
        </button>
      </div>

      <!-- Alert for error messages -->
      <div id="authAlert" class="alert alert-danger py-2 px-3 d-none mb-3" role="alert"></div>

      <!-- Tabs Navigation -->
      <ul class="nav auth-nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="tab-login" data-bs-toggle="tab" data-bs-target="#pane-login" type="button">
            Sign In
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-register" data-bs-toggle="tab" data-bs-target="#pane-register" type="button">
            Register Shop
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content">
        <!-- Login Form -->
        <div class="tab-pane fade show active" id="pane-login" role="tabpanel">
          <form id="formLogin">
            <div class="mb-3">
              <label for="loginEmail" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="loginEmail" placeholder="name@shop.com" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
              </div>
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary py-2" id="btnLoginSubmit">
                Sign In to Dashboard
              </button>
            </div>
          </form>
        </div>

        <!-- Register Form -->
        <div class="tab-pane fade" id="pane-register" role="tabpanel">
          <form id="formRegister">
            <div class="mb-2">
              <label for="regShopName" class="form-label small fw-semibold">Shop / Business Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shop"></i></span>
                <input type="text" class="form-control" id="regShopName" placeholder="e.g. Modern Grocers" required>
              </div>
            </div>
            <div class="mb-2">
              <label for="regName" class="form-label small fw-semibold">Owner Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="regName" placeholder="e.g. Abdullah Akond" required>
              </div>
            </div>
            <div class="mb-2">
              <label for="regEmail" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="regEmail" placeholder="owner@store.com" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label small fw-semibold">Password (min 6 characters)</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="regPassword" placeholder="••••••••" minlength="6" required>
              </div>
            </div>
            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-primary py-2" id="btnRegisterSubmit">
                Create Account & Shop
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-4">
        <small class="text-muted">DIU Capstone Project • Member 1: Abdullah Al Junaed Akond</small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
